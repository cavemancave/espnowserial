; PlatformIO Project Configuration File
;
;   ESP-NOW wireless serial bridge for the ESP32-C3 Pro Mini (HW-953AB).
;   Flash the same image on both boards.
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-pro-mini]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
monitor_rts     = 0
monitor_dtr     = 0

; Upload
upload_speed    = 921600

; Native USB on the ESP32-C3 (GPIO18 / GPIO19).  The firmware does not rely on
; it exclusively: the console is mirrored on UART0 as well, so boards whose
; USB-C is driven by an external CH340 / CP2102 bridge keep working unchanged.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

